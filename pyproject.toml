[project]
name = "webhands"
version = "0.1.0"
description = "浏览器 Agent 底座 + 探索式测试 Agent + 单据录入 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM115", "E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
