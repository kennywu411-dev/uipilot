{% extends "base.html" %}{% block title %}商品资料{% endblock %}
{% block body %}
<h2>商品资料</h2>
<table class="grid">
  <tr><th>编码</th><th>名称</th><th>单位</th><th class="num">参考单价</th></tr>
  {% for r in rows %}<tr><td>{{ r.sku }}</td><td>{{ r.name }}</td><td>{{ r.unit }}</td><td class="num">{{ money(r.price_cents) }}</td></tr>{% endfor %}
</table>
{% endblock %}
